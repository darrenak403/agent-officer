services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: office
      POSTGRES_USER: office
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - office-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U office -d office']
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build: .
    command: sh -c 'pnpm --filter @office/database exec prisma migrate deploy && pnpm --filter @office/api start'
    environment:
      DATABASE_URL: ${DATABASE_URL}
      OFFICE_INGEST_TOKEN: ${OFFICE_INGEST_TOKEN}
      HOST: 0.0.0.0
      PORT: 4100
    ports:
      - '127.0.0.1:4100:4100'
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: .
    command: pnpm --filter @office/web exec next start -H 0.0.0.0
    environment:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:4100
      OFFICE_API_INTERNAL_URL: http://api:4100
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      - api

volumes:
  office-postgres:
