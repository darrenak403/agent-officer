[package]
name = "agent-office"
version = "0.1.0"
edition = "2021"
description = "Agent Office desktop app: tray icon, embedded office server, static UI"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tokio = { version = "1", features = ["sync"] }
office-core = { path = "../../core" }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"
