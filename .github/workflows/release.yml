# Push a tag like v0.2.0: builds the macOS app, signs the update bundle and publishes it as a
# Release of this repo, where installed apps find latest.json and offer the update.
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: apps/desktop/src-tauri }
      - run: pnpm install --frozen-lockfile
      - name: Static UI
        run: pnpm desktop:ui
      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v="${GITHUB_REF_NAME#v}"
          jq --arg v "$v" '.version = $v' apps/desktop/src-tauri/tauri.conf.json > c.json && mv c.json apps/desktop/src-tauri/tauri.conf.json
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: Agent Office ${{ github.ref_name }}
          releaseBody: Tải file .dmg bên dưới. Bản đã cài sẽ tự hỏi cập nhật.
          releaseDraft: false
          includeUpdaterJson: true
          args: --target aarch64-apple-darwin
